name: Automated Secure Containerized CI/CD Pipeline

# Trigger setup: Pehle push par bhi chalega aur aage se PR par bhi!
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  devsecops-pipeline:
    runs-on: ubuntu-latest # Background cloud server

    steps:
    # 1. Source code ko virtual server par download karna
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Trivy Security Scan (Filesystem level scan for vulnerabilities & secrets)
    - name: Run Trivy Security Vulnerability Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        severity: 'CRITICAL,HIGH'
        exit-code: '1' # Critical error milne par pipeline block kar dega!
        cache:  'false'  # purani memory se nehi karega restart karega scan

    # 3. Docker Hub Registry par Secure Login
    - name: Login to Docker Hub Registry
      if: success() # Trivy pass hone par hi chalega
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4. Final Build aur Upload to Cloud Registry
    - name: Build and Push Secure Docker Image
      if: success()
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/secure-node-app:latest
